<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego Pong Clásico</title>
    <style>
        body {
            background-color: #111;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            overflow: hidden;
        }
        h1 {
            margin-top: 10px;
            margin-bottom: 5px;
        }
        p {
            color: #888;
            font-size: 14px;
            margin-bottom: 15px;
        }
        canvas {
            background-color: #000;
            border: 4px solid white;
            display: block;
            margin: 0 auto;
            box-shadow: 0px 0px 20px rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <h1>PONG</h1>
    <p>Jugador Izquierdo: W (Arriba) / S (Abajo) | Jugador Derecho: Flecha Arriba / Flecha Abajo</p>
    
    <!-- Lienzo donde se dibuja el juego -->
    <canvas id="pongCanvas" width="800" height="500"></canvas>

    <script>
        const canvas = document.getElementById("pongCanvas");
        const ctx = canvas.getContext("2d");

        // Configuración de las paletas
        const paddleWidth = 10;
        const paddleHeight = 100;

        // Jugador 1 (Izquierda)
        const player = {
            x: 10,
            y: canvas.height / 2 - paddleHeight / 2,
            width: paddleWidth,
            height: paddleHeight,
            score: 0,
            dy: 0 // Velocidad actual de movimiento
        };

        // Jugador 2 (Derecha)
        const computer = {
            x: canvas.width - paddleWidth - 10,
            y: canvas.height / 2 - paddleHeight / 2,
            width: paddleWidth,
            height: paddleHeight,
            score: 0,
            dy: 0
        };

        // Configuración de la pelota
        const ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 8,
            speed: 5,
            velocityX: 5,
            velocityY: 5
        };

        // Velocidad de movimiento de las paletas
        const paddleSpeed = 7;

        // Escuchar las teclas presionadas
        const keysPressed = {};

        window.addEventListener("keydown", (e) => {
            keysPressed[e.key] = true;
        });

        window.addEventListener("keyup", (e) => {
            keysPressed[e.key] = false;
        });

        // Reiniciar la pelota al centro tras un punto
        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.speed = 5;
            // Invierte la dirección para que saque el jugador que acaba de recibir el punto
            ball.velocityX = -ball.velocityX > 0 ? ball.speed : -ball.speed;
            ball.velocityY = Math.random() > 0.5 ? ball.speed : -ball.speed;
        }

        // Detectar colisiones entre la pelota y una paleta
        function collision(b, p) {
            return b.x - b.radius < p.x + p.width &&
                   b.x + b.radius > p.x &&
                   b.y - b.radius < p.y + p.height &&
                   b.y + b.radius > p.y;
        }

        // Actualizar las posiciones y lógica del juego en cada cuadro
        function update() {
            // Movimiento del Jugador 1 (W y S)
            if (keysPressed["w"] || keysPressed["W"]) {
                player.y -= paddleSpeed;
            }
            if (keysPressed["s"] || keysPressed["S"]) {
                player.y += paddleSpeed;
            }

            // Movimiento del Jugador 2 (Flechas)
            if (keysPressed["ArrowUp"]) {
                computer.y -= paddleSpeed;
            }
            if (keysPressed["ArrowDown"]) {
                computer.y += paddleSpeed;
            }

            // Evitar que las paletas salgan de los bordes del lienzo
            player.y = Math.max(0, Math.min(canvas.height - player.height, player.y));
            computer.y = Math.max(0, Math.min(canvas.height - computer.height, computer.y));

            // Mover la pelota
            ball.x += ball.velocityX;
            ball.y += ball.velocityY;

            // Rebotar en los bordes superior e inferior
            if (ball.y - ball.radius < 0 || ball.y + ball.radius > canvas.height) {
                ball.velocityY = -ball.velocityY;
            }

            // Determinar qué paleta está en el camino de la pelota
            let playerTurn = (ball.x < canvas.width / 2) ? player : computer;

            // Si hay colisión con la paleta
            if (collision(ball, playerTurn)) {
                // Calcular dónde golpeó la pelota en la paleta (-1 arriba, 0 centro, 1 abajo)
                let collidePoint = (ball.y - (playerTurn.y + playerTurn.height / 2));
                collidePoint = collidePoint / (playerTurn.height / 2);

                // Calcular el ángulo de rebote (máximo 45 grados)
                let angleRad = (Math.PI / 4) * collidePoint;

                // Cambiar dirección X de la pelota
                let direction = (ball.x < canvas.width / 2) ? 1 : -1;
                
                // Incrementar ligeramente la velocidad para aumentar la dificultad
                ball.speed += 0.4;
                ball.velocityX = direction * ball.speed * Math.cos(angleRad);
                ball.velocityY = ball.speed * Math.sin(angleRad);
            }

            // Marcar puntos si la pelota sale por los lados
            if (ball.x - ball.radius < 0) {
                computer.score++;
                resetBall();
            } else if (ball.x + ball.radius > canvas.width) {
                player.score++;
                resetBall();
            }
        }

        // Dibujar los elementos gráficos en el lienzo
        function render() {
            // Limpiar la pantalla en cada frame
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Dibujar la red del medio (línea punteada)
            ctx.strokeStyle = "rgba(255, 255, 255, 0.2)";
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]); // Resetear patrón de línea

            // Dibujar marcador de puntos
            ctx.fillStyle = "#FFF";
            ctx.font = "45px 'Courier New'";
            ctx.fillText(player.score, canvas.width / 4, 60);
            ctx.fillText(computer.score, (3 * canvas.width) / 4, 60);

            // Dibujar paletas
            ctx.fillStyle = "#FFF";
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.fillRect(computer.x, computer.y, computer.width, computer.height);

            // Dibujar pelota (cuadrada al estilo retro original, o circular si prefieres cambiar a .arc)
            ctx.fillRect(ball.x - ball.radius, ball.y - ball.radius, ball.radius * 2, ball.radius * 2);
        }

        // Bucle principal del juego
        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        // Iniciar el juego
        gameLoop();
    </script>
</body>
</html>
